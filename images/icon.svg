<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.15" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.88" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#f97316" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowBlue)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowOrange)"/>

  <!-- Group tiers: rising bars -->
  <g fill="url(#bar)" opacity="0.55">
    <rect x="72"  y="350" width="56" height="86"  rx="12"/>
    <rect x="148" y="296" width="56" height="140" rx="12"/>
    <rect x="224" y="236" width="56" height="200" rx="12"/>
    <rect x="300" y="172" width="56" height="264" rx="12"/>
    <rect x="376" y="104" width="56" height="332" rx="12"/>
  </g>

  <!-- Energy bolt -->
  <path d="M292 60 L140 292 H242 L210 452 L374 206 H272 L322 60 Z"
        fill="url(#bolt)" stroke="#fff7ed" stroke-width="10" stroke-linejoin="round"
        filter="url(#shadow)"/>
</svg>
